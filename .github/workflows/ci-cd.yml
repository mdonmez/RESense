name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: CI
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Read and validate package version
        id: package-version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq "resense" })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one resense package in cargo metadata."
          }

          $version = [string]$packages[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Package version '$version' is not a stable X.Y.Z version."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match Cargo.toml version '$version'."
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage release binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "release-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath "target\release\resense.exe" -Destination (Join-Path $staging "resense.exe")

      - name: Upload release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ github.ref_name }}
          path: release-staging/resense.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-${{ github.ref_name }}
          path: release-input

      - name: Validate release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          $expectedTag = "v$env:PACKAGE_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match expected tag '$expectedTag'."
          }

          $releaseListJson = gh release list --limit 1000 --json tagName
          $releaseListExitCode = $LASTEXITCODE
          if ($releaseListExitCode -ne 0) {
            throw "Unable to query existing GitHub Releases (exit code $releaseListExitCode)."
          }

          $releaseList = @($releaseListJson | ConvertFrom-Json)
          if ($releaseList.tagName -contains $env:GITHUB_REF_NAME) {
            throw "A GitHub Release already exists for '$env:GITHUB_REF_NAME'."
          }

          $LASTEXITCODE = 0

      - name: Package release assets
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:PACKAGE_VERSION
          $tag = $env:GITHUB_REF_NAME
          $releaseRoot = Join-Path $env:RUNNER_TEMP "resense-release-$version"
          $packageRoot = Join-Path $releaseRoot "package"
          $zipName = "resense-$version-windows-x86_64.zip"

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath "release-input\resense.exe" -Destination (Join-Path $packageRoot "resense.exe")
          $skillPath = Join-Path $releaseRoot "SKILL.md"
          Copy-Item -LiteralPath ".agents\skills\resense\SKILL.md" -Destination $skillPath
          if (-not (Test-Path -LiteralPath $skillPath -PathType Leaf)) {
            throw "The RESense skill source was not packaged as SKILL.md."
          }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $skillPath -Raw))) {
            throw "The packaged SKILL.md is empty."
          }

          $zipPath = Join-Path $releaseRoot $zipName
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $archiveEntries = @($archive.Entries | ForEach-Object { $_.FullName })
          }
          finally {
            $archive.Dispose()
          }
          if ($archiveEntries.Count -ne 1 -or $archiveEntries[0] -ne "resense.exe") {
            throw "The release ZIP must contain only resense.exe. Entries: $($archiveEntries -join ', ')"
          }

          $installerTemplate = Get-Content -LiteralPath "packaging\install.ps1.template" -Raw
          $installer = $installerTemplate.Replace("__VERSION__", $version).Replace("__RELEASE_TAG__", $tag)
          $installerPath = Join-Path $releaseRoot "install.ps1"
          Set-Content -LiteralPath $installerPath -Value $installer -Encoding utf8NoBOM

          $uninstallerPath = Join-Path $releaseRoot "uninstall.ps1"
          Copy-Item -LiteralPath "packaging\uninstall.ps1" -Destination $uninstallerPath

          $assetFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" })
          $checksumLines = foreach ($asset in $assetFiles) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          Set-Content -LiteralPath (Join-Path $releaseRoot "SHA256SUMS.txt") -Value $checksumLines -Encoding ascii

          $renderedInstaller = Get-Content -LiteralPath $installerPath -Raw
          if ($renderedInstaller -match "__VERSION__|__RELEASE_TAG__") {
            throw "The rendered installer still contains a template placeholder."
          }
          [void][scriptblock]::Create($renderedInstaller)
          [void][scriptblock]::Create((Get-Content -LiteralPath $uninstallerPath -Raw))

          "release_root=$releaseRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksums_path=$(Join-Path $releaseRoot 'SHA256SUMS.txt')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "uninstaller_path=$uninstallerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "skill_path=$skillPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $skillChecksumEntries = @(Get-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') | Where-Object {
            $parts = $_.Trim() -split '\s+', 2
            $parts.Count -eq 2 -and $parts[1].Trim() -eq 'SKILL.md'
          })
          if ($skillChecksumEntries.Count -ne 1) {
            throw "SHA256SUMS.txt does not contain the fixed SKILL.md asset."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          $releaseRoot = "${{ steps.package.outputs.release_root }}"
          $tag = $env:GITHUB_REF_NAME
          $version = $env:PACKAGE_VERSION
          $assets = @(
            "${{ steps.package.outputs.zip_path }}",
            "${{ steps.package.outputs.checksums_path }}",
            "${{ steps.package.outputs.installer_path }}",
            "${{ steps.package.outputs.uninstaller_path }}",
            "${{ steps.package.outputs.skill_path }}"
          )

          & gh release create $tag @assets --title "RESense $version" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed for '$tag'."
          }
